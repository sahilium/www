# https://docs.codecov.com/docs/codecov-yaml
codecov:
  require_ci_to_pass: false

coverage:
  status:
    project:
      default:
        target: auto
        informational: true
    patch:
      default:
        informational: true

flag_management:
  default_rules:
    carryforward: true

flags:
  api:
    paths:
      - api/
  obsidian-plugin:
    paths:
      - obsidian-plugin/