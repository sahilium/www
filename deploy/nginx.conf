# Static site server for the Astro build (dist/).
# Placed in /etc/nginx/conf.d/ of nginxinc/nginx-unprivileged — runs as a
# non-root user listening on 8080 (Traefik reaches it over the proxy network).
#
# Cache rules mirror public/_headers

server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain
               text/css
               application/javascript
               application/json
               application/xml
               image/svg+xml
               application/rss+xml;

    # Astro generates a 404.html; keep the real 404 status code.
    error_page 404 /404.html;

    # Hashed, content-addressed build assets — immutable.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000";
        try_files $uri =404;
    }

    location /images/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Pretty URLs: /about -> /about/index.html, files served as-is,
    # everything else falls through to the 404 page.
    location / {
        try_files $uri $uri/ =404;
    }
}
