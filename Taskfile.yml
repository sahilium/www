# https://taskfile.dev
version: "3"

vars:
  API_DIR: api

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task: list

  list:
    desc: List all tasks
    cmd: task --list-all

  # ---------------- site ----------------
  dev:
    desc: Run the Astro dev server
    cmds:
      - bun run dev

  build:
    desc: Build the static site
    cmds:
      - bun run build

  preview:
    desc: Preview the production build
    cmds:
      - bun run preview

  test:
    desc: Run Playwright tests
    cmds:
      - bun run test

  typecheck:
    desc: Type-check the site
    cmds:
      - bunx astro check

  lint:
    desc: Lint the site (Biome)
    cmds:
      - bun run lint

  lint:fix:
    desc: Auto-fix lint issues
    cmds:
      - bun run lint:fix

  # ---------------- api ----------------
  api:dev:
    desc: Run the API with hot reload (air) on :8080
    dir: "{{.API_DIR}}"
    cmds:
      - air

  api:run:
    desc: Run the API once, no reload
    dir: "{{.API_DIR}}"
    cmds:
      - go run ./cmd/server

  api:build:
    desc: Build the API binary
    dir: "{{.API_DIR}}"
    cmds:
      - go build -o bin/server ./cmd/server

  api:test:
    desc: Run the API tests
    dir: "{{.API_DIR}}"
    cmds:
      - go test ./...

  api:coverage:
    desc: Run the API tests with coverage
    dir: "{{.API_DIR}}"
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  api:vet:
    desc: Vet the API code
    dir: "{{.API_DIR}}"
    cmds:
      - go vet ./...

  api:lint:
    desc: Lint the API (go vet + gofmt check)
    dir: "{{.API_DIR}}"
    cmds:
      - go vet ./...
      - test -z "$(gofmt -l .)"

  api:lint:fix:
    desc: Format the API code (gofmt -w)
    dir: "{{.API_DIR}}"
    cmds:
      - gofmt -w .

  api:fmt:
    desc: Format the API code
    dir: "{{.API_DIR}}"
    cmds:
      - gofmt -w .

  api:install:
    desc: Install air for hot reload (run once)
    dir: "{{.API_DIR}}"
    cmds:
      - go install github.com/air-verse/air@latest

  # ---------------- obsidian plugin ----------------
  obsidian:install:
    desc: Install Obsidian plugin dependencies
    dir: obsidian-plugin
    cmds:
      - npm install

  obsidian:dev:
    desc: Build the Obsidian plugin and watch for changes
    dir: obsidian-plugin
    cmds:
      - npm run dev

  obsidian:build:
    desc: Type-check and build the Obsidian plugin
    dir: obsidian-plugin
    cmds:
      - npm run build

  obsidian:typecheck:
    desc: Type-check the Obsidian plugin
    dir: obsidian-plugin
    cmds:
      - tsc -noEmit

  obsidian:test:
    desc: Run Obsidian plugin tests (vitest)
    dir: obsidian-plugin
    cmds:
      - npm run test

  obsidian:coverage:
    desc: Run Obsidian plugin tests with coverage
    dir: obsidian-plugin
    cmds:
      - npm run coverage