# https://taskfile.dev
version: "3"

vars:
  API_DIR: api

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task: list

  list:
    desc: List all tasks
    cmd: task --list-all

  # ---------------- site ----------------
  dev:
    desc: Run the Astro dev server
    cmds:
      - bun run dev

  build:
    desc: Build the static site
    cmds:
      - bun run build

  preview:
    desc: Preview the production build
    cmds:
      - bun run preview

  test:
    desc: Run Playwright tests
    cmds:
      - bun run test

  typecheck:
    desc: Type-check the site
    cmds:
      - bunx astro check

  # ---------------- api ----------------
  api:dev:
    desc: Run the API with hot reload (air) on :8080
    dir: "{{.API_DIR}}"
    cmds:
      - air

  api:run:
    desc: Run the API once, no reload
    dir: "{{.API_DIR}}"
    cmds:
      - go run ./cmd/server

  api:build:
    desc: Build the API binary
    dir: "{{.API_DIR}}"
    cmds:
      - go build -o bin/server ./cmd/server

  api:test:
    desc: Run the API tests
    dir: "{{.API_DIR}}"
    cmds:
      - go test ./...

  api:vet:
    desc: Vet the API code
    dir: "{{.API_DIR}}"
    cmds:
      - go vet ./...

  api:fmt:
    desc: Format the API code
    dir: "{{.API_DIR}}"
    cmds:
      - gofmt -w .

  api:install:
    desc: Install air for hot reload (run once)
    dir: "{{.API_DIR}}"
    cmds:
      - go install github.com/air-verse/air@latest